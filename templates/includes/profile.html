<div id="profile-view" class="view-section">
    <h2 style="margin-bottom:20px;">👤 User Profile</h2>
    <div style="max-width: 600px; margin: 0 auto; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 24px; box-shadow: var(--shadow-sm);">

        <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:24px;">
            <div id="profile-photo-wrap" style="position:relative; width:100px; height:100px; cursor:pointer;" onclick="document.getElementById('profile-photo-input').click()">
                <img id="profile-photo-img" src="" alt="Profile" onerror="this.src=''" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid var(--primary); background:var(--bg-main); display:block;">
                <div id="profile-photo-placeholder" style="width:100px; height:100px; border-radius:50%; background:var(--bg-main); border:3px solid var(--primary); display:flex; align-items:center; justify-content:center; font-size:2.5rem; color:var(--primary); position:absolute; top:0; left:0;">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div style="position:absolute; bottom:0; right:0; background:var(--primary); color:#fff; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.8rem; border:2px solid var(--bg-card); cursor:pointer;" title="Change photo">
                    <i class="fas fa-camera"></i>
                </div>
            </div>
            <input type="file" id="profile-photo-input" accept="image/*" style="display:none;" onchange="handleProfilePhotoChange(event)">
            <p style="font-size:0.8rem; color:var(--text-light); margin-top:8px;">Click to upload photo</p>
        </div>

        <div class="input-group">
            <label><i class="fas fa-user"></i> Full Name</label>
            <input type="text" id="prof-name" placeholder="Rajesh Kumar" style="width:100%; padding:10px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-main);">
        </div>
        <div class="input-group" style="margin-top:15px">
            <label><i class="fas fa-envelope"></i> Email (Read-only)</label>
            <input type="email" id="prof-email" readonly style="width:100%; padding:10px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-light); opacity:0.7;">
        </div>
        <div class="input-group" style="margin-top:15px">
            <label><i class="fas fa-phone"></i> Phone</label>
            <input type="tel" id="prof-phone" placeholder="+91 98765 43210" style="width:100%; padding:10px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-main);">
        </div>
        <div class="auth-form-row" style="margin-top:15px; display:flex; gap:12px;">
            <div class="input-group" style="flex:1;">
                <label><i class="fas fa-map-pin"></i> Pincode</label>
                <input type="text" id="prof-pincode" placeholder="e.g. 226001" onblur="fetchLocationFromPincode(this.value,'prof-location')" style="width:100%; padding:10px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-main);">
            </div>
            <div class="input-group" style="flex:1;">
                <label><i class="fas fa-map-marker-alt"></i> Location</label>
                <input type="text" id="prof-location" placeholder="Lucknow, UP" style="width:100%; padding:10px; border-radius:var(--radius-md); border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-main);">
            </div>
        </div>

        <div style="margin-top:25px; display:flex; gap:12px;">
            <button class="btn-auth" onclick="updateProfile()" id="update-profile-btn" style="flex:1; background:var(--primary);">
                <i class="fas fa-save"></i> Save Profile
            </button>
        </div>

        <hr style="border:0; border-top:1px solid var(--border-color); margin:30px 0;">

        <div style="background:rgba(239,68,68,0.05); border:1px solid rgba(239,68,68,0.2); border-radius:var(--radius-md); padding:16px;">
            <h3 style="color:var(--danger); font-size:1.1rem; margin-bottom:8px;">
                <i class="fas fa-exclamation-triangle"></i> Danger Zone
            </h3>
            <p style="font-size:0.9rem; color:var(--text-light); margin-bottom:16px;">
                Once you delete your account, there is no going back. Please be certain.
            </p>
            <button class="btn-auth" onclick="deleteProfileConfirm()" style="background:var(--danger); font-size:0.9rem; padding:8px 16px; width:auto;">
                Delete Account
            </button>
        </div>
    </div>
</div>
