<div id="mandi-view" class="view-section" style="background: linear-gradient(135deg, #eaf6ea, #fffff0);">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; padding: 0 20px;">
        <div style="display:flex; align-items:baseline; gap: 10px;">
            <h2 style="margin:0; color: #0b4d3c; font-weight: 700; font-size: 1.8rem;">Mandi Rates</h2>
            <span style="color: #666; font-size: 0.9rem;">Live Market Prices</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
            <span id="mandi-last-updated" style="font-size:0.8rem; color:var(--text-light);"></span>
            <button onclick="refreshMandiRates()" style="background:var(--primary); color:#fff; border:none; padding:8px 16px; border-radius:20px; font-size:0.85rem; cursor:pointer; display:flex; align-items:center; gap:6px;">
                <i class="fas fa-sync-alt" id="mandi-refresh-icon"></i> Refresh
            </button>
        </div>
    </div>

    <div id="mandi-location-banner" style="display:none; background:linear-gradient(135deg,rgba(0,176,155,0.1),rgba(150,201,61,0.08)); border:1px solid rgba(0,176,155,0.25); border-radius:12px; padding:14px 18px; margin-bottom:16px;">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="background:rgba(0,176,155,0.15); width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:1.1rem; flex-shrink:0;">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div>
                    <div id="mandi-location-name" style="font-weight:700; font-size:0.95rem; color:var(--text-main);">Detecting location...</div>
                    <div id="mandi-location-sub" style="font-size:0.75rem; color:var(--text-light);">Rates for your nearest mandi</div>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <span id="mandi-location-season" style="background:rgba(150,201,61,0.15); color:#5a8a00; border:1px solid rgba(150,201,61,0.3); border-radius:999px; padding:3px 12px; font-size:0.78rem; font-weight:600;">Live</span>
                <span id="mandi-location-crops-count" style="font-size:0.78rem; color:var(--text-light);">32 Crops Listed</span>
            </div>
        </div>
    </div>

    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;">
        <input type="text" id="mandi-search" placeholder="🔍 Search crop..."
            oninput="filterMandiTable(this.value)"
            style="padding:8px 14px; border-radius:20px; border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-main); font-size:0.9rem; min-width:180px; flex:1;">

        <div style="display:flex; align-items:center; border:1px solid var(--border-color); border-radius:20px; overflow:hidden; background:var(--bg-input);">
            <span style="padding:8px 10px 8px 14px; font-size:0.85rem; color:var(--text-light); white-space:nowrap; border-right:1px solid var(--border-color);">
                <i class="fas fa-map-pin"></i> PIN
            </span>
            <input type="text" id="mandi-pincode-input" placeholder="e.g. 226001"
                maxlength="6" inputmode="numeric"
                style="padding:8px 10px; border:none; background:transparent; color:var(--text-main); font-size:0.9rem; width:110px; outline:none;"
                onkeydown="if(event.key==='Enter') fetchRatesByPincode()">
            <button onclick="fetchRatesByPincode()"
                style="padding:8px 14px; background:var(--primary); color:#fff; border:none; font-size:0.82rem; cursor:pointer; white-space:nowrap; font-weight:600;">
                Search
            </button>
        </div>
    </div>

    <div style="background:#ffffff; border-radius:12px; border:1px solid #d4ecd4; box-shadow:0 4px 20px rgba(0,176,155,0.05); overflow:hidden; margin: 0 20px 20px 20px; max-height: calc(100vh - 300px); overflow-y: auto;">
        <table style="width:100%; border-collapse:collapse; table-layout: fixed;">
            <thead style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">
                <tr style="border-bottom:2px solid #e2e8f0;">
                    <th style="padding:10px 14px; text-align:left; font-size:0.75rem; font-weight:700; color:#475569; text-transform:uppercase; width:25%;">Crop</th>
                    <th style="padding:10px 14px; text-align:left; font-size:0.75rem; font-weight:700; color:#475569; text-transform:uppercase; width:25%;">Mandi</th>
                    <th style="padding:10px 14px; text-align:right; font-size:0.75rem; font-weight:700; color:#475569; text-transform:uppercase; width:18%;">Min ₹/q</th>
                    <th style="padding:10px 14px; text-align:right; font-size:0.75rem; font-weight:700; color:#475569; text-transform:uppercase; width:18%;">Max ₹/q</th>
                    <th style="padding:10px 14px; text-align:center; font-size:0.75rem; font-weight:700; color:#475569; text-transform:uppercase; width:14%;">Trend</th>
                </tr>
            </thead>
            <tbody id="mandi-tbody">
                <tr>
                    <td colspan="5" style="text-align:center; padding:40px; color:var(--text-light);">
                        <i class="fas fa-spinner fa-spin"></i> Loading mandi rates...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <p style="font-size:0.8rem; color:#888; text-align:center; padding-bottom: 40px; margin-top: 10px;">
        * Rates updated daily from major mandis across India
    </p>

</div>

<script src="mandi-ticker-fixed.js"></script>
